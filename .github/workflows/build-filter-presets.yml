name: Build Filter Presets (Heltec)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      include_init_area_variants:
        description: Build all init_cmds_<Area>.txt variants as matrix rows
        required: false
        type: boolean
        default: true
      target_allowlist_regex:
        description: Regex whitelist for repeater targets
        required: false
        type: string
        default: '^(heltec_v4(_r8)?|heltec_v4_tft|heltec_v4_expansionkit|heltec_v4_r8_tft|Heltec_v3|Heltec_WSL3).*(_repeater|_repeater_observer)$'
      init_area_allowlist_regex:
        description: Regex whitelist for init areas (__default__ and/or area names)
        required: false
        type: string
        default: ''
      max_matrix_size:
        description: Hard cap on generated matrix size (GitHub max is 256)
        required: false
        type: string
        default: '256'

jobs:
  build-filter-presets:
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'repeater'
      release_title_prefix: 'Repeater Firmware'
      include_init_area_variants: ${{ inputs.include_init_area_variants }}
      target_allowlist_regex: ${{ inputs.target_allowlist_regex }}
      init_area_allowlist_regex: ${{ inputs.init_area_allowlist_regex }}
      max_matrix_size: ${{ inputs.max_matrix_size }}
