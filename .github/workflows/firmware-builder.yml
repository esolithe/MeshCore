name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-build-targets.outputs.matrix }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)

          if [[ "${{ inputs.firmware_type }}" == "repeater" ]]; then
            AREA_LIST=$(/usr/bin/env bash build.sh get-init-cmd-areas-to-build)
            MATRIX_JSON=$(jq -cn \
              --arg targets "$TARGET_LIST" \
              --arg areas "$AREA_LIST" \
              '
                ($targets | split("\n") | map(select(length > 0))) as $t
                | ($areas | split("\n") | map(select(length > 0))) as $a
                | [
                    $t[] as $target
                    | $a[] as $area
                    | (if $area == "__default__" then "init-default" else ("init-" + ($area | ascii_downcase | gsub("[^a-z0-9]+"; "-"))) end) as $suffix
                    | {
                        target: $target,
                        init_area: $area,
                        init_area_env: (if $area == "__default__" then "" else $area end),
                        artifact_suffix: $suffix,
                        artifact_name: ($target + "-" + $suffix)
                      }
                  ]
              ')
          else
            MATRIX_JSON=$(jq -cn --arg targets "$TARGET_LIST" '
              ($targets | split("\n") | map(select(length > 0)))
              | map({ target: ., init_area: "", init_area_env: "", artifact_suffix: "", artifact_name: . })
            ')
          fi

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
          INIT_CMDS_AREA: ${{ matrix.init_area_env }}
          FIRMWARE_FILENAME_SUFFIX: ${{ matrix.artifact_suffix }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.artifact_name }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.release_title_prefix }} ${{ env.GIT_TAG_VERSION }}"
          body: ""
          draft: true
          files: out/*
