name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      include_init_area_variants:
        required: false
        type: string
        default: 'false'
      target_allowlist_regex:
        required: false
        type: string
        default: ''
      init_area_allowlist_regex:
        required: false
        type: string
        default: ''
      max_matrix_size:
        required: false
        type: string
        default: '256'

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-build-targets.outputs.matrix }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        env:
          INCLUDE_INIT_AREA_VARIANTS: ${{ inputs.include_init_area_variants }}
          TARGET_ALLOWLIST_REGEX: ${{ inputs.target_allowlist_regex }}
          INIT_AREA_ALLOWLIST_REGEX: ${{ inputs.init_area_allowlist_regex }}
          MAX_MATRIX_SIZE: ${{ inputs.max_matrix_size }}
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)
          TARGET_JSON=$(printf '%s\n' "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          if [[ "${{ inputs.firmware_type }}" == "repeater" ]]; then
            if [[ "$INCLUDE_INIT_AREA_VARIANTS" == "true" ]]; then
              AREA_LIST=$(/usr/bin/env bash build.sh get-init-cmd-areas-to-build)
            else
              AREA_LIST="__default__"
            fi

            AREA_JSON=$(printf '%s\n' "$AREA_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            MATRIX_JSON=$(jq -cn \
              --argjson targets "$TARGET_JSON" \
              --argjson areas "$AREA_JSON" \
              --arg targetRx "$TARGET_ALLOWLIST_REGEX" \
              --arg areaRx "$INIT_AREA_ALLOWLIST_REGEX" \
              '
                (if $targetRx == "" then $targets else [ $targets[] | select(test($targetRx; "i")) ] end) as $selectedTargets
                | (if $areaRx == "" then $areas else [ $areas[] | select(test($areaRx; "i")) ] end) as $selectedAreas
                | [
                    $selectedTargets[] as $target
                    | $selectedAreas[] as $area
                    | (if $area == "__default__" then "init-default" else ("init-" + ($area | ascii_downcase | gsub("[^a-z0-9]+"; "-"))) end) as $suffix
                    | {
                        target: $target,
                        init_area: $area,
                        init_area_env: (if $area == "__default__" then "" else $area end),
                        artifact_suffix: $suffix,
                        artifact_name: ($target + "-" + $suffix)
                      }
                  ]
              ')
          else
            MATRIX_JSON=$(jq -cn \
              --argjson targets "$TARGET_JSON" \
              --arg targetRx "$TARGET_ALLOWLIST_REGEX" \
              '
              (if $targetRx == "" then $targets else [ $targets[] | select(test($targetRx; "i")) ] end)
              | map({ target: ., init_area: "", init_area_env: "", artifact_suffix: "", artifact_name: . })
            ')
          fi

          MATRIX_COUNT=$(echo "$MATRIX_JSON" | jq 'length')
          if ! [[ "$MAX_MATRIX_SIZE" =~ ^[0-9]+$ ]]; then
            echo "::error::max_matrix_size must be a positive integer, got '$MAX_MATRIX_SIZE'."
            exit 1
          fi

          if [[ "$MATRIX_COUNT" -eq 0 ]]; then
            echo "::error::No firmware builds selected. Check target_allowlist_regex/init_area_allowlist_regex and include_init_area_variants settings."
            exit 1
          fi

          if [[ "$MATRIX_COUNT" -gt "$MAX_MATRIX_SIZE" ]]; then
            echo "::error::Matrix has $MATRIX_COUNT jobs, exceeding max $MAX_MATRIX_SIZE. Narrow target_allowlist_regex or disable include_init_area_variants."
            exit 1
          fi

          TARGET_COUNT=$(echo "$MATRIX_JSON" | jq '[.[].target] | unique | length')
          AREA_COUNT=$(echo "$MATRIX_JSON" | jq '[.[].init_area] | unique | length')
          echo "Building $MATRIX_COUNT jobs from $TARGET_COUNT targets across $AREA_COUNT init area set(s)."

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
          INIT_CMDS_AREA: ${{ matrix.init_area_env }}
          FIRMWARE_FILENAME_SUFFIX: ${{ matrix.artifact_suffix }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.artifact_name }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.release_title_prefix }} ${{ env.GIT_TAG_VERSION }}"
          body: ""
          draft: true
          files: out/*
