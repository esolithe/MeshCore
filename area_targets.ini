; Per-area firmware variants. Each env selects a provisioning list
; init_cmds_<Area>.txt from the project root via custom_init_cmds_area
; (see scripts/gen_init_cmds.py). To add an area: create init_cmds_<Area>.txt
; and clone the env below — inherits everything else from the base target.
;
; The base envs (no area) keep embedding the generic init_cmds.txt.

[env:heltec_v4_repeater_observer_manchester]
extends = env:heltec_v4_repeater_observer
custom_init_cmds_area = Manchester
build_flags =
  ${env:heltec_v4_repeater_observer.build_flags}
build_src_filter =
  ${env:heltec_v4_repeater_observer.build_src_filter}
lib_deps =
  ${env:heltec_v4_repeater_observer.lib_deps}
